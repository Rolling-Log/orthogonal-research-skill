<svg xmlns="http://www.w3.org/2000/svg" width="1200" role="img" viewBox="0 0 1200 344"><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif}</style><title>一份研究材料，通过公共组件生成 HTML、PDF 和可编辑资料</title><rect width="1200" height="344" rx="24" fill="#f5f5f7"/><text x="48" y="54" font-size="15" letter-spacing="2" fill="#75757e">REUSE / DELIVERY</text><rect x="48" y="92" width="293" height="188" rx="20" fill="#fff"/><text x="76" y="138" font-size="26" font-weight="600" fill="#1d1d1f">一份研究材料</text><text x="76" y="184" font-size="19" fill="#676770">完整正文 · 来源台账</text><text x="76" y="219" font-size="19" fill="#676770">数字与图像 · 组件配置</text><path d="M363 184H405m-8-7 8 7-8 7" fill="none" stroke="#afb0b8" stroke-width="2"/><rect x="429" y="92" width="325" height="188" rx="20" fill="#fff"/><text x="457" y="138" font-size="26" font-weight="600" fill="#1d1d1f">公共呈现与构建</text><text x="457" y="184" font-size="19" fill="#676770">10 类交互 · 6 类静态图</text><text x="457" y="219" font-size="19" fill="#676770">排版、引用、配色与阅读工具</text><path d="M776 184H818m-8-7 8 7-8 7" fill="none" stroke="#afb0b8" stroke-width="2"/><rect x="842" y="92" width="310" height="85" rx="18" fill="#eaf3fc"/><text x="869" y="128" font-size="23" font-weight="600" fill="#0062c4">HTML + PDF</text><text x="869" y="156" font-size="15" fill="#4c6278">交互探索与完整阅读</text><rect x="842" y="193" width="310" height="87" rx="18" fill="#fff"/><text x="869" y="229" font-size="21" font-weight="600" fill="#1d1d1f">可编辑资料</text><text x="869" y="258" font-size="16" fill="#676770">Markdown · JSON · CSV · 图像</text></svg>