<svg xmlns="http://www.w3.org/2000/svg" width="1200" role="img" viewBox="0 0 1200 468"><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif}</style><title>纵向与横向研究在交汇处形成可追溯的判断</title><rect width="1200" height="468" rx="24" fill="#f5f5f7"/><text x="48" y="54" font-size="15" letter-spacing="2" fill="#75757e">RESEARCH / UNDERSTANDING</text><rect x="48" y="99" width="230" height="265" rx="20" fill="#fff"/><text x="74" y="139" font-size="15" fill="#0071e3">01 · 从问题出发</text><text x="74" y="189" font-size="27" font-weight="600" fill="#1d1d1f">它是什么？</text><text x="74" y="236" font-size="18" fill="#64646d">定义对象与研究范围</text><text x="74" y="270" font-size="18" fill="#64646d">收集原文与不同视角</text><text x="74" y="304" font-size="18" fill="#64646d">追溯时间、出处与口径</text><path d="M299 232H336m-8-7 8 7-8 7" fill="none" stroke="#afb0b8" stroke-width="2"/><rect x="360" y="99" width="457" height="265" rx="20" fill="#fff"/><path d="M402 253H772M564 132V334" stroke="#c9dced" stroke-width="2"/><circle cx="564" cy="253" r="8" fill="#0071e3"/><text x="596" y="164" font-size="21" font-weight="600" fill="#1d1d1f">纵向 · 来路</text><text x="596" y="197" font-size="16" fill="#64646d">关键转折与历史约束</text><text x="391" y="304" font-size="21" font-weight="600" fill="#1d1d1f">横向 · 选择</text><text x="599" y="304" font-size="16" fill="#64646d">同一问题下的差异</text><path d="M838 232H875m-8-7 8 7-8 7" fill="none" stroke="#afb0b8" stroke-width="2"/><rect x="898" y="99" width="254" height="265" rx="20" fill="#eaf3fc"/><text x="924" y="139" font-size="15" fill="#0062c4">03 · 在交汇处判断</text><text x="924" y="190" font-size="27" font-weight="600" fill="#1d1d1f">解释今天的选择</text><text x="924" y="238" font-size="18" fill="#4c6278">联系历史与当前差异</text><text x="924" y="271" font-size="18" fill="#4c6278">核查反方与替代解释</text><text x="924" y="304" font-size="18" fill="#4c6278">说明成立条件与依据</text><text x="48" y="423" font-size="17" fill="#6e6e77">问题 → 证据 → 分析 → 判断；每一步都能回到材料。</text></svg>
