<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" role="img" aria-labelledby="title desc"><title id="title">版本与下载规则</title><desc id="desc">默认分支及最新版压缩包只包含V3.1，旧版通过标签和历史发布保留。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="238" rx="20" fill="#F1F6F8" stroke="none"/><text x="38" y="43" font-size="29" fill="#1A5276" font-weight="700" text-anchor="start">一个当前版，完整的历史。</text><rect x="38" y="74" width="430" height="124" rx="16" fill="#FFFFFF" stroke="none"/><text x="65" y="117" font-size="28" fill="#1E8449" font-weight="700" text-anchor="start">V3.1  当前推荐</text><text x="65" y="156" font-size="21" fill="#20384A" font-weight="400" text-anchor="start">主页 · 安装入口 · 最新 ZIP</text><path d="M 498 135 L 566 135" stroke="#A9BBC4" stroke-width="2" fill="none" stroke-dasharray="7 6"/><rect x="598" y="74" width="562" height="124" rx="16" fill="#E6EDF1" stroke="none"/><text x="625" y="116" font-size="25" fill="#1A5276" font-weight="700" text-anchor="start">历史标签 / 历史发布</text><text x="625" y="156" font-size="22" fill="#20384A" font-weight="400" text-anchor="start">V1 → V2 → V2.1 → V2.2 → V3</text></g></svg>