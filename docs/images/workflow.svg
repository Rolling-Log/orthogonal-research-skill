<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286" role="img" aria-labelledby="title desc"><title id="title">纵横调研的五步工作流程</title><desc id="desc">明确对象，追溯证据，纵横分析，反方核查，交付PDF与完整研究包。</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect x="0" y="0" width="1200" height="286" rx="20" fill="#FFFFFF" stroke="none"/><text x="38" y="45" font-size="30" fill="#1A5276" font-weight="700" text-anchor="start">一份报告，怎样形成？</text><rect x="32" y="82" width="212" height="152" rx="14" fill="#F4F7F9" stroke="none"/><text x="52" y="116" font-size="19" fill="#1E8449" font-weight="700" text-anchor="start">01</text><text x="52" y="162" font-size="28" fill="#1A5276" font-weight="700" text-anchor="start">明确对象</text><text x="52" y="199" font-size="18" fill="#60798A" font-weight="400" text-anchor="start">理解用途与边界</text><path d="M 249 158 L 262 158" stroke="#A4BAC5" stroke-width="2" fill="none" /><text x="257" y="164" font-size="26" fill="#A4BAC5" font-weight="400" text-anchor="start">›</text><rect x="268" y="82" width="212" height="152" rx="14" fill="#F4F7F9" stroke="none"/><text x="288" y="116" font-size="19" fill="#1E8449" font-weight="700" text-anchor="start">02</text><text x="288" y="162" font-size="28" fill="#1A5276" font-weight="700" text-anchor="start">追溯证据</text><text x="288" y="199" font-size="18" fill="#60798A" font-weight="400" text-anchor="start">找原文，留出处</text><path d="M 485 158 L 498 158" stroke="#A4BAC5" stroke-width="2" fill="none" /><text x="493" y="164" font-size="26" fill="#A4BAC5" font-weight="400" text-anchor="start">›</text><rect x="504" y="82" width="212" height="152" rx="14" fill="#F4F7F9" stroke="none"/><text x="524" y="116" font-size="19" fill="#1E8449" font-weight="700" text-anchor="start">03</text><text x="524" y="162" font-size="28" fill="#1A5276" font-weight="700" text-anchor="start">纵横分析</text><text x="524" y="199" font-size="18" fill="#60798A" font-weight="400" text-anchor="start">解释演变与差异</text><path d="M 721 158 L 734 158" stroke="#A4BAC5" stroke-width="2" fill="none" /><text x="729" y="164" font-size="26" fill="#A4BAC5" font-weight="400" text-anchor="start">›</text><rect x="740" y="82" width="212" height="152" rx="14" fill="#F4F7F9" stroke="none"/><text x="760" y="116" font-size="19" fill="#1E8449" font-weight="700" text-anchor="start">04</text><text x="760" y="162" font-size="28" fill="#1A5276" font-weight="700" text-anchor="start">反方核查</text><text x="760" y="199" font-size="18" fill="#60798A" font-weight="400" text-anchor="start">检验结论与未知</text><path d="M 957 158 L 970 158" stroke="#A4BAC5" stroke-width="2" fill="none" /><text x="965" y="164" font-size="26" fill="#A4BAC5" font-weight="400" text-anchor="start">›</text><rect x="976" y="82" width="212" height="152" rx="14" fill="#F4F7F9" stroke="none"/><text x="996" y="116" font-size="19" fill="#1E8449" font-weight="700" text-anchor="start">05</text><text x="996" y="162" font-size="28" fill="#1A5276" font-weight="700" text-anchor="start">交付报告</text><text x="996" y="199" font-size="18" fill="#60798A" font-weight="400" text-anchor="start">PDF · 图表 · 来源</text><text x="38" y="267" font-size="20" fill="#60798A" font-weight="400" text-anchor="start">关键判断写明：证据、强替代解释，以及什么会改变结论。</text></g></svg>